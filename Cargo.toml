[package]
name = "pinetree"
version = "0.1.0"
edition = "2024"

[profile.test]
opt-level = 1

[features]
default = []
fdb = ["dep:foundationdb", "dep:foundationdb-sys"]

[dependencies]
redb = "4.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_bytes = "0.11.19"
regex = "1.13.1"
rand = "0.10.3"
uuid = { version = "1.28.0", features = ["v4"] }
axum = { version = "0.8", features = ["multipart"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
foundationdb = { version = "0.11.0", features = ["fdb-7_3"], optional = true }
foundationdb-sys = { version = "0.11.0", features = ["fdb-7_3"], optional = true }
