[package]
name = "pinetree"
version = "0.1.0"
edition = "2024"

# Disk budget: full debuginfo and the incremental cache dominate target/.
# Line tables keep panic locations; incremental=false drops target/debug/incremental.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = false

[features]
default = []
fdb = ["dep:foundationdb", "dep:foundationdb-sys"]

[dependencies]
redb = "4.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_bytes = "0.11.19"
regex = "1.13.1"
rand = "0.10.3"
uuid = { version = "1.28.0", features = ["v4"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
http-body-util = "0.1"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
signature = "2"
spki = { version = "0.7", features = ["pem"] }
rand_core = "0.6"
base64 = "0.23"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
foundationdb = { version = "0.11.0", features = ["fdb-7_3"], optional = true }
foundationdb-sys = { version = "0.11.0", features = ["fdb-7_3"], optional = true }
argon2 = "0.5"
ring = "0.17"
futures-util = "0.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures-core = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
